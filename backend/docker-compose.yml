version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: calmora-postgres
    environment:
      POSTGRES_USER: calmora
      POSTGRES_PASSWORD: calmora
      POSTGRES_DB: calmora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmora -d calmora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
